openapi: 3.0.3
info:
  title: Documentation Demo API
  version: 1.0.0
  description: A tiny read-only API definition for trying Swagger UI from the documentation page.
servers:
  - url: https://jsonplaceholder.typicode.com
    description: Public demo API
paths:
  /todos/{id}:
    get:
      operationId: getTodo
      summary: Get a todo by ID
      parameters:
        - name: id
          in: path
          required: true
          description: Todo identifier (1-200)
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 1
      responses:
        '200':
          description: Todo record
          content:
            application/json:
              schema:
                type: object
                required:
                  - userId
                  - id
                  - title
                  - completed
                properties:
                  userId:
                    type: integer
                  id:
                    type: integer
                  title:
                    type: string
                  completed:
                    type: boolean